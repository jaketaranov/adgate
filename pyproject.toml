[project]
name = "adgate"
version = "0.1.0"
description = "Two-gate ad suitability & relevance middleware for LLM applications: only show an ad when the query warrants one AND a genuinely relevant ad exists"
requires-python = ">=3.11"
# NOTE: torch (pulled in by sentence-transformers) ships CUDA wheels by
# default on Linux (~2.5 GB). For CPU-only machines install torch first:
#   pip install torch --index-url https://download.pytorch.org/whl/cpu
dependencies = [
    "pydantic>=2",
    "sentence-transformers>=3",
    "rank-bm25",
    "litellm",
    "pyyaml",
    "scikit-learn",
    "statsmodels",
    "numpy",
]

[project.optional-dependencies]
data = ["datasets"]
service = ["fastapi", "uvicorn"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adgate"]
